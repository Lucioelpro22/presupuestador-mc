<!doctype html>
<html lang="es-AR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presupuestador MC</title>
<style>
:root{color-scheme:light;--ink:#202827;--muted:#53605c;--line:#d5dcd7;--paper:#fff;--accent:#105e53;--wash:#edf5f1}
*{box-sizing:border-box}
body{margin:0;background:#f6f7f4;color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:1000px;margin:auto;padding:32px clamp(16px,4vw,44px) 64px}
header,.brand,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header{justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:30px}
header a{color:var(--accent);font-size:.9rem;text-underline-offset:4px}
.mark{display:inline-grid;place-items:center;width:44px;height:44px;background:var(--accent);color:white;border-radius:9px;font-size:1.05rem;font-weight:800;letter-spacing:-.07em}
h1,h2,p{margin-top:0}header h1{margin:0;font-size:clamp(1.3rem,4vw,1.8rem);letter-spacing:-.05em;font-weight:650}
h2{margin-bottom:18px;font-size:1.22rem;letter-spacing:-.025em}
.panel,#sheet{background:var(--paper);padding:clamp(18px,4vw,36px);border:1px solid var(--line);border-radius:14px}
#editor{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:0 clamp(16px,4vw,36px)}
#editor>.panel{padding:26px 0;border:0;border-bottom:1px solid var(--line);border-radius:0}
#editor>.actions{padding:20px 0}.grid,.item{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
.wide{grid-column:1/-1}label{display:grid;gap:6px;color:var(--muted);font-size:.875rem;font-weight:580}
input,textarea,button{font:inherit;color:var(--ink);border:1px solid #aab8b1;border-radius:7px;padding:10px 12px;background:white}
input,textarea{width:100%;min-width:0;font-size:1rem}textarea{resize:vertical}
button{min-height:44px;cursor:pointer;font-weight:600}button:hover{background:var(--wash)}
.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#094b42}
:focus-visible{outline:3px solid #278779;outline-offset:2px}
.item{grid-template-columns:minmax(0,3fr) repeat(2,minmax(0,1fr)) minmax(0,1.6fr) auto;align-items:end;margin-bottom:14px}
#numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:16px;margin-top:20px;border-radius:8px;background:var(--wash)}
.amount{display:grid;gap:3px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.amount small{color:var(--muted)}.grand{grid-column:1/-1;border-top:1px solid #bbcfc6;padding-top:12px}
.grand strong,.total strong{font-size:clamp(1.7rem,5vw,2.6rem);letter-spacing:-.045em;line-height:1.15;color:var(--accent)}
#history,#preview{margin-top:28px;scroll-margin-top:16px}#status:empty{display:none}#status{margin:12px 0;color:var(--accent)}
.record{border-bottom:1px solid var(--line);padding:16px 0;overflow-wrap:anywhere}.record:last-child{border:0}.record p{margin-bottom:8px}#records>p{margin:16px 0 0;color:var(--muted)}
#sheet{max-width:800px;margin:16px auto;overflow-wrap:anywhere}#sheet .brand{padding-bottom:18px;border-bottom:2px solid var(--ink)}
.brand img{max-width:140px;max-height:65px;object-fit:contain}
#sheet h1{margin:26px 0 6px;font-size:clamp(1.65rem,5vw,2.3rem);line-height:1.15;letter-spacing:-.04em}
#sheet h2{font-size:1.12rem;margin:22px 0 8px}#sheet p{white-space:pre-wrap}#sheet table{width:100%;border-collapse:collapse}
td,th{text-align:left;border-bottom:1px solid var(--line);padding:8px 4px}th{font-size:.85rem;color:var(--muted)}
.total{display:grid;gap:4px;border-top:2px solid var(--accent);padding-top:16px;margin:24px 0;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media(max-width:620px){main{padding-top:18px}header{margin-bottom:18px}.grid{grid-template-columns:1fr}.item{grid-template-columns:repeat(2,minmax(0,1fr));padding:14px 0;border-top:1px solid var(--line)}.item label:first-child{grid-column:1/-1}.item button{justify-self:start}#numbers{grid-template-columns:1fr}.amount:not(.grand){display:flex;justify-content:space-between;gap:8px}}
@page{size:A4;margin:16mm}
@media print{body{background:white}main{max-width:none;padding:0}main>:not(#preview),#preview>.actions{display:none!important}#preview{margin:0}#sheet{max-width:none;margin:0;border:0;padding:0}#sheet h2{break-after:avoid}tr,.brand,.total{break-inside:avoid}.mark{background:white;color:var(--ink);border:1px solid currentColor}.total strong{color:var(--ink)}}
</style>
<main><header><div class="brand"><span class="mark" aria-hidden="true">MC</span><h1>Presupuestador MC</h1></div><a href="#history">Ver guardados</a></header>
<form id="editor">
<div class="panel"><h2>Datos del presupuesto</h2><div class="grid">
<label>Cliente<input name="client" required maxlength="160"></label><label>Fecha de emisión<input name="date" type="date" required></label>
<label class="wide">Trabajo y alcance<textarea name="work" rows="2" maxlength="2400" required></textarea></label>
<label>Vigencia en días<input name="days" type="number" value="15" min="1" max="365" required></label>
<label>Logo propio (PNG o JPG, hasta 300 KB)<input id="logo" type="file" accept="image/png,image/jpeg"></label>
<label class="wide">Condiciones de pago<textarea name="terms" rows="2" maxlength="1200" required></textarea></label></div></div>
<div class="panel"><h2>Materiales</h2><div id="items"></div><button type="button" id="add">Agregar material</button></div>
<div class="panel"><h2>Cálculo interno</h2><div class="grid">
<label>Mano de obra (ARS)<input name="labor" required type="number" value="0" min="0" max="999999999" step=".01"></label>
<label>Traslado (ARS)<input name="travel" required type="number" value="0" min="0" max="999999999" step=".01"></label>
<label>Recargo sobre costos (%)<input name="markup" required type="number" value="0" min="0" max="1000" step=".01"></label></div>
<output id="numbers" aria-live="polite"></output></div>
<div class="actions"><button class="primary" id="save">Guardar y ver presupuesto</button><button type="button" id="cancel" hidden>Cancelar edición</button></div></form>
<p role="status" id="status"></p>
<div class="panel" id="history"><h2>Presupuestos guardados</h2><label>Buscar por número, cliente o trabajo<input type="search" id="search"></label><div id="records"></div></div>
<section id="preview" hidden><div class="actions"><button id="print" class="primary">Imprimir / Guardar PDF</button><button id="close">Cerrar vista del cliente</button></div><article id="sheet"></article></section>
</main>
<template id="material"><div class="item">
<label>Material<input data-field="name" required maxlength="160"></label>
<label>Cantidad<input data-field="qty" required type="number" value="1" min=".001" max="999999" step=".001"></label>
<label>Unidad<input data-field="unit" required value="un." maxlength="16"></label>
<label>Costo unitario (ARS)<input data-field="price" required type="number" min="0" max="999999999" step=".01"></label>
<button type="button">Quitar</button></div></template>
<script>
'use strict';
const $=id=>document.getElementById(id);
const form=$('editor'), fields=form.elements;
const money=new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS'});
const pesos=cents=>money.format(cents/100);
const key='presupuestador-mc-v2';
let saved=[], editing=null, logo='', loadedVersion=null;
const today=()=>new Date().toLocaleDateString('sv-SE');
const number=id=>'MC-'+String(id).padStart(5,'0');
const notify=msg=>$('status').textContent=msg;
function totals(q){
  const materials=q.items.reduce((sum,item)=>sum+Math.round(Math.round(Number(item.price)*100)*Number(item.qty)),0);
  const cost=materials+Math.round(q.labor*100)+Math.round(q.travel*100);
  const gain=Math.round(cost*q.markup/100);
  return {materials,cost,gain,total:cost+gain};
}
function legacy(row,index){
  const [client,work,price,labor,travel,markup]=row;
  return {id:index+1,client,work,labor,travel,markup,date:'',days:'',terms:'',logo:'',
    items:Number(price)?[{name:'Materiales presupuestados',qty:1,unit:'lote',price}]:[]};
}
function load(){
  loadedVersion=localStorage.getItem(key);
  saved=loadedVersion===null?JSON.parse(localStorage.getItem('presupuestador-mc-v1')||'[]').map(legacy):JSON.parse(loadedVersion);
  if(!Array.isArray(saved))throw Error('Formato inválido');
}
function addMaterial(values={}){
  const row=$('material').content.firstElementChild.cloneNode(true);
  for(const input of row.querySelectorAll('input')){
    if(values[input.dataset.field]!==undefined)input.value=values[input.dataset.field];
  }
  row.querySelector('button').onclick=()=>{row.remove();refresh()};
  $('items').append(row);
  return row;
}
function read(){
  const data=Object.fromEntries(new FormData(form));
  data.items=Array.from($('items').children,row=>Object.fromEntries(
    Array.from(row.querySelectorAll('input'),i=>[i.dataset.field,i.value.trim()])));
  return {...data,client:data.client.trim(),work:data.work.trim(),terms:data.terms.trim(),logo};
}
function refresh(){
  const t=totals(read());
  const entries=[['Materiales',t.materials],['Costo total',t.cost],['Recargo',t.gain],['Precio final',t.total]];
  $('numbers').replaceChildren(...entries.map(([label,value],index)=>{
    const line=element('span','');
    line.className=index===3?'amount grand':'amount';
    line.append(element('small',label),element('strong',pesos(value)));
    return line;
  }));
}
function reset(){
  form.reset();editing=null;logo='';$('items').replaceChildren();
  fields.date.value=today();$('cancel').hidden=true;$('save').textContent='Guardar y ver presupuesto';refresh();
}
function edit(q){
  reset();editing=q.id;logo=q.logo;
  for(const key of ['client','work','date','days','terms','labor','travel','markup'])fields[key].value=q[key];
  q.items.forEach(addMaterial);$('cancel').hidden=false;$('preview').hidden=true;
  $('save').textContent='Guardar cambios y ver presupuesto';refresh();fields.client.focus();
}
function element(tag,content){
  const node=document.createElement(tag);node.textContent=content;return node;
}
function action(label,fn){
  const button=element('button',label);button.onclick=fn;return button;
}
function show(q){
  const sheet=$('sheet');sheet.replaceChildren();
  const brand=element('div','');brand.className='brand';
  if(q.logo){const img=new Image();img.src=q.logo;img.alt='Logo';brand.append(img)}
  else{const mark=element('b','MC');mark.className='mark';brand.append(mark)}
  brand.append(element('strong','Servicios Integrales MC'));
  sheet.append(brand,element('h1','Presupuesto '+number(q.id)));
  if(q.date)sheet.append(element('p','Emisión '+q.date.split('-').reverse().join('/')+' · Vigencia '+q.days+' días'));
  sheet.append(element('h2',q.client),element('p',q.work));
  if(q.items.length){
    sheet.append(element('h2','Materiales incluidos'));
    const table=document.createElement('table');
    const head=table.createTHead().insertRow();
    for(const label of ['Descripción','Cantidad','Unidad'])head.append(element('th',label));
    const body=table.createTBody();
    for(const item of q.items){
      const row=body.insertRow();
      for(const value of [item.name,Number(item.qty).toLocaleString('es-AR'),item.unit])row.insertCell().textContent=value;
    }
    sheet.append(table);
  }
  const total=element('div','');
  total.className='total';
  total.append(element('span','Total en pesos argentinos'),element('strong',pesos(totals(q).total)));
  sheet.append(total);
  if(q.terms)sheet.append(element('h2','Condiciones de pago'),element('p',q.terms));
  $('preview').hidden=false;$('preview').scrollIntoView({block:'start'});
}
function list(){
  const records=$('records');records.replaceChildren();
  const query=$('search').value.trim().toLowerCase();
  for(const q of [...saved].reverse()){
    if(![number(q.id),q.client,q.work].join(' ').toLowerCase().includes(query))continue;
    const card=element('div','');card.className='record';
    const buttons=element('div','');buttons.className='actions';
    buttons.append(action('Ver presupuesto',()=>show(q)),action('Editar',()=>edit(q)));
    card.append(element('p',number(q.id)+' · '+q.client+' · '+pesos(totals(q).total)),buttons);records.append(card);
  }
  if(!records.childElementCount)records.append(element('p',saved.length?'Sin coincidencias.':'Todavía no hay presupuestos guardados.'));
}
async function readLogo(file){
  if(!file)return logo;
  if(!['image/png','image/jpeg'].includes(file.type)||file.size>300000)throw Error('Elegí una imagen PNG o JPG de hasta 300 KB.');
  const value=await new Promise((resolve,reject)=>{
    const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(Error('No se pudo leer el logo.'));reader.readAsDataURL(file);
  });
  const img=new Image();img.src=value;await img.decode();return value;
}
form.onsubmit=async event=>{
  event.preventDefault();$('save').disabled=true;
  try{
    const q=read();
    if(!q.client||!q.work||!q.terms||q.items.some(i=>!i.name||!i.unit))throw Error('Revisá los campos vacíos.');
    if(!Number.isSafeInteger(totals(q).total))throw Error('El total excede el rango admitido.');
    q.logo=await readLogo($('logo').files[0]);
    if(localStorage.getItem(key)!==loadedVersion)throw Error('Los registros cambiaron en otra pestaña. Recargá antes de guardar.');
    q.id=editing??saved.reduce((max,r)=>Math.max(max,r.id),0)+1;
    const next=editing===null?[...saved,q]:saved.map(r=>r.id===editing?q:r);
    const version=JSON.stringify(next);localStorage.setItem(key,version);
    loadedVersion=version;saved=next;reset();$('search').value='';list();notify('Guardado en este navegador.');show(q);
  }catch(e){notify(e.name==='QuotaExceededError'?'Sin espacio para guardar. Probá con un logo más chico.':e.message)}
  finally{$('save').disabled=false}
};
$('add').onclick=()=>addMaterial().querySelector('input').focus();
form.oninput=refresh;$('search').oninput=list;$('cancel').onclick=reset;
$('print').onclick=()=>window.print();$('close').onclick=()=>$('preview').hidden=true;
try{load();reset();list()}catch{form.querySelectorAll('button').forEach(b=>b.disabled=true);notify('No se pudieron leer los registros locales. Conservá los datos del navegador.')}
</script></html>
