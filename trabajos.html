<!doctype html><html lang="es-AR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor de trabajos</title><style>
:root{color-scheme:light;--ink:#202827;--accent:#105e53;--line:#d5dcd7;--paper:#fff;--ground:#f6f7f4}
*{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif}
main{max-width:960px;margin:auto;padding:28px clamp(16px,4vw,44px) 64px}
header,.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px}
.mark{display:grid;place-items:center;width:44px;height:44px;background:var(--accent);color:white;font-weight:800;border-radius:9px}
h1,h2,h3{letter-spacing:-.035em;line-height:1.2}h1{margin:0;font-size:clamp(1.35rem,4vw,1.9rem)}header a{margin-left:auto}a{color:var(--accent);text-underline-offset:4px}
form,.panel,article{border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:clamp(18px,3vw,30px)}
form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}form h2,form .actions{grid-column:1/-1}
h2{font-size:1.22rem;margin:0 0 8px}h3{margin:0 0 8px}label{display:grid;gap:6px;font-size:.9rem;color:#475650;font-weight:600}
input,select,button{max-width:100%;min-width:0;padding:10px 12px;border:1px solid #aab8b1;border-radius:7px;background:white;color:var(--ink);font:inherit;font-size:1rem}
button{min-height:44px;cursor:pointer;font-weight:600}button:hover{background:#edf5f1}form button:first-of-type,.primary{background:var(--accent);color:white}
:focus-visible{outline:3px solid #278779;outline-offset:2px}[hidden]{display:none!important}
.toolbar{margin:30px 0 16px}.toolbar h2{margin-bottom:12px}article{margin:12px 0;overflow-wrap:anywhere}article p{white-space:pre-wrap}
.amount{display:block;color:var(--accent);font-size:clamp(1.25rem,4vw,1.65rem);font-variant-numeric:tabular-nums;padding:12px 0;border-top:1px solid var(--line);margin-top:14px}article button{margin:6px 8px 0 0}#status:empty{display:none}
@media(max-width:600px){form{grid-template-columns:1fr}header a{margin-left:0}}
@page{size:A4;margin:16mm}
@media print{body{background:white}main{max-width:none;padding:0}form,button,.toolbar,#empty,#status,header a,article:not(.print){display:none!important}article{border:0;padding:0}.mark{background:white;color:var(--ink);border:1px solid currentColor}}
</style><main><header><span class="mark" aria-hidden="true">MC</span><h1>Gestor de trabajos</h1><nav class="actions"><a href="index.html">Presupuestos</a><a href="trabajos.html">Trabajos</a><a href="caja.html">Caja</a></nav></header><form><h2>Ficha de trabajo</h2><label>Cliente<input required maxlength="160"></label>
<label>Trabajo<input required maxlength="160"></label>
<label>Fecha de visita<input required type="date"></label>
<label>Estado<select><option>Consulta</option><option>Visita</option><option>Presupuestado</option><option>En curso</option><option>Terminado</option></select></label>
<label>Presupuesto (ARS)<input required type="number" step="any" min="0"></label>
<label>Cobrado (ARS)<input required type="number" step="any" min="0"></label><div class="actions"><button>Guardar</button><button type="button" id="cancel" hidden>Cancelar edición</button></div></form><p id="status" role="status"></p><div class="toolbar"><h2>Trabajos desde presupuestos</h2><div id="linked"></div></div><div class="toolbar" id="history"><h2>Trabajos guardados</h2><label>Buscar un registro<input id="search" type="search"></label></div><p id="empty"></p><section></section></main><script>
const key='gestor-de-trabajos-v1';
const form=document.querySelector('form');
const controls=[...form.querySelectorAll('input,select')];
const list=document.querySelector('section');
const statusText=document.querySelector('#status');
const money=value=>value.toLocaleString('es-AR',{style:'currency',currency:'ARS'});
let rows=JSON.parse(localStorage.getItem(key)||'[]');
let editing=-1;
function describe(v){
  const n=i=>Number(v[i]);
  return [v[0],v[1],v[2],v[3],'Presupuesto '+money(n(4)), 'Cobrado '+money(n(5)), 'Saldo '+money(n(4)-n(5))]
}
const cancel=document.querySelector('#cancel');
function resetForm(){
  editing=-1;
  form.reset();
  cancel.hidden=true;
  form.querySelector('button').textContent='Guardar';
}
cancel.onclick=resetForm;
const search=document.querySelector('#search');
search.addEventListener('input',render);
function render(){
  list.replaceChildren();
  rows.forEach((row,index)=>{
    if(!row.join(' ').toLocaleLowerCase().includes(search.value.trim().toLocaleLowerCase())) return;
    const card=document.createElement('article');
    const summary=document.createElement('p');
    const parts=describe(row);
    const title=document.createElement('h3');
    title.textContent=parts[0];
    summary.textContent=[1, 2, 3, 4, 5].map(i=>parts[i]).join(' · ');
    const amount=document.createElement('strong');
    amount.className='amount';
    amount.textContent=parts[parts.length-1];
    card.append(title,summary,amount);
    for(const label of ['Editar','Imprimir / PDF']){
      const button=document.createElement('button');
      button.textContent=label;
      button.onclick=()=>{
        if(label==='Editar'){
          editing=index;
          cancel.hidden=false;
          form.querySelector('button').textContent='Guardar cambios';
          controls.forEach((input,i)=>input.value=row[i]);
          controls[0].focus();
        }else{
          card.classList.add('print');
          window.print();
          card.classList.remove('print');
        }
      };
      card.append(button);
    }
    list.prepend(card);
  });
  document.querySelector('#empty').textContent=list.childElementCount ? '' :
    (rows.length ? 'No hay coincidencias.' : 'Todavía no hay registros guardados.');
}
form.onsubmit=event=>{
  event.preventDefault();
  const row=controls.map(input=>input.value.trim());
  try{
    if(row.some(value=>value==='')) throw Error('Completá todos los campos.');
    describe(row);
    const updated=rows.slice();
    updated[editing<0?updated.length:editing]=row;
    localStorage.setItem(key,JSON.stringify(updated));
    rows=updated;
    resetForm();
    search.value='';
    render();
    statusText.textContent='Guardado en este navegador.';
  }catch(error){statusText.textContent=error.message}
};
render();
const quotesKey='presupuestador-mc-v2';
function quoteTotal(q){
  const cents=value=>Math.round(Number(value)*100);
  const cost=q.items.reduce((sum,item)=>sum+Math.round(cents(item.price)*Number(item.qty)),0)+cents(q.travel)+cents(q.labor);
  return cost+Math.round(cost*Number(q.markup)/100);
}
function paid(job){return job.payments.reduce((sum,p)=>sum+p.cents,0)}
function addPayment(q,amount,date){
  const cents=Math.round(Number(amount)*100);
  if(!Number.isSafeInteger(cents)||cents<=0||!date||cents>quoteTotal(q)-paid(q.job))throw Error('Revisá la fecha y el importe. El cobro debe ser mayor que cero y no superar el saldo.');
  q.job.payments.push({date,cents});
}
function renderLinked(){
  const box=document.querySelector('#linked');box.replaceChildren();
  const raw=localStorage.getItem(quotesKey);
  const quotes=JSON.parse(raw||'[]').filter(q=>q.job);
  function update(id,change){
    try{
      if(localStorage.getItem(quotesKey)!==raw)throw Error('Los datos cambiaron. Volvé a abrir la ficha.');
      const next=JSON.parse(raw);change(next.find(q=>q.id===id));
      localStorage.setItem(quotesKey,JSON.stringify(next));renderLinked();
    }catch(e){renderLinked();statusText.textContent=e.message;statusText.scrollIntoView()}
  }
  const node=(tag,content)=>{const el=document.createElement(tag);el.textContent=content;return el};
  for(const q of quotes.slice().reverse()){
    const ref='MC-'+String(q.id).padStart(5,'0');
    if(key==='control-gastos-ingresos-v1'){
      for(const payment of q.job.payments){
        box.append(node('p',payment.date+' · Emprendimiento · '+ref+' · '+q.client+' · Ingreso '+money(payment.cents/100)));
      }
      continue;
    }
    const card=node('article','');card.id='mc-'+q.id;
    card.append(node('h3',ref+' · '+q.client),node('p',q.work),node('p','Aceptado · Presupuesto '+money(quoteTotal(q)/100)+' · Cobrado '+money(paid(q.job)/100)),
      node('strong','Saldo '+money((quoteTotal(q)-paid(q.job))/100)));
    function input(label,type,value){
      const wrap=node('label',label),field=node('input','');field.type=type;field.value=value;field.required=true;wrap.append(field);return [wrap,field];
    }
    const visitForm=node('form',''),[visitLabel,visit]=input('Fecha de visita','date',q.job.visit);
    visitForm.append(visitLabel,node('button','Guardar visita'));
    visitForm.onsubmit=e=>{e.preventDefault();update(q.id,entry=>entry.job.visit=visit.value)};
    card.append(visitForm);
    if(paid(q.job)<quoteTotal(q)){
      const f=node('form',''),[al,amount]=input('Seña o cobro (ARS)','number',''),[dl,date]=input('Fecha de cobro','date',new Date().toLocaleDateString('sv-SE'));
      amount.step='.01';amount.min='.01';amount.max=String((quoteTotal(q)-paid(q.job))/100);
      f.append(al,dl,node('button','Registrar cobro'));
      f.onsubmit=e=>{e.preventDefault();update(q.id,entry=>addPayment(entry,amount.value,date.value))};
      card.append(f);
    }
    for(const p of q.job.payments)card.append(node('p',p.date+' · Cobro '+money(p.cents/100)));
    box.append(card);
  }
  if(!box.childElementCount)box.append(node('p',key=== 'control-gastos-ingresos-v1'?'Todavía no hay cobros de trabajos.':'Todavía no hay presupuestos aceptados.'));
}
renderLinked();
window.addEventListener('storage',event=>{if(event.key===quotesKey)renderLinked()});
</script></html>
